name: The Flame CI

on:
  push:
    paths:
      - "the-flame/**"
      - ".github/workflows/the-flame-ci.yml"
  pull_request:
    paths:
      - "the-flame/**"
      - ".github/workflows/the-flame-ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: the-flame
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npx vite build

      - name: Test
        run: npm test
